<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DreamArt Rental</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080d18;--sidebar:#0b1120;--card:#0f1826;--card2:#131e2e;
  --border:#1a2840;--text:#e2e8f0;--muted:#5a6a85;
  --accent:#3b82f6;--green:#22c55e;--yellow:#f59e0b;
  --red:#ef4444;--orange:#f97316;--purple:#8b5cf6;
  --bottom-h:60px;
}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
.hidden{display:none!important}

/* ===== LOGIN ===== */
.login-screen{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%,#13213b,#080d18);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:30px 26px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.login-logo{width:64px;height:64px;margin:0 auto 14px;background:linear-gradient(135deg,#1d4ed8,#7c3aed);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;box-shadow:0 0 24px rgba(124,58,237,.5)}
.login-title{text-align:center;font-size:18px;font-weight:700;margin-bottom:3px}
.login-sub{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:22px}
.login-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--bg);border-radius:10px;padding:4px}
.login-tab{flex:1;padding:9px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-weight:600}
.login-tab.active{background:var(--accent);color:#fff}
.login-field{margin-bottom:12px}
.login-field label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}
.login-field input,.login-field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:11px 13px;color:var(--text);font-size:14px;outline:none}
.login-field input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px}
.login-hint{font-size:10.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}

/* SIDEBAR */
.sidebar{width:200px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s;z-index:50}
.logo{padding:14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border)}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#1d4ed8,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;box-shadow:0 0 14px rgba(124,58,237,.5);flex-shrink:0}
.logo-main{font-size:13px;font-weight:700;color:#fff}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.nav{flex:1;padding:8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:12.5px;transition:all .15s;margin-bottom:1px;user-select:none}
.nav-item:hover{background:rgba(59,130,246,.08);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(59,130,246,.2),rgba(59,130,246,.05));color:#60a5fa;border-left:2px solid var(--accent);font-weight:500}
.nav-item svg{width:15px;height:15px;flex-shrink:0}
.nav-item .nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;border-radius:9px;padding:1px 6px;font-weight:700}
.nav-sep{height:1px;background:var(--border);margin:5px 3px}
.nav-bottom{padding:8px;border-top:1px solid var(--border)}
.admin-only{display:none}
body.is-admin .admin-only{display:flex}
.role-pill{font-size:9px;padding:2px 7px;border-radius:7px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.role-admin{background:rgba(139,92,246,.18);color:var(--purple);border:1px solid rgba(139,92,246,.35)}
.role-gost{background:rgba(245,158,11,.16);color:var(--yellow);border:1px solid rgba(245,158,11,.3)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--sidebar);border-bottom:1px solid var(--border);padding:0 14px;height:50px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.hamburger{display:none;background:transparent;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:4px;flex-shrink:0}
.clock-box{background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:7px;padding:3px 9px;line-height:1.2;flex-shrink:0}
.clock-day{font-size:9px;color:var(--muted)}
.clock-time{font-size:14px;font-weight:700;letter-spacing:1.5px;color:#fff}
.kurs{font-size:11px;color:var(--muted);cursor:pointer;border:1px solid transparent;padding:3px 7px;border-radius:7px;transition:all .15s}
.kurs:hover{border-color:var(--border);background:var(--card2)}
.kurs b{color:var(--yellow)}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.lang-sel{position:relative}
.lang-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px}
.lang-drop{display:none;position:absolute;right:0;top:32px;background:var(--card);border:1px solid var(--border);border-radius:8px;z-index:100;min-width:130px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.lang-drop.open{display:block}
.lang-opt{padding:9px 13px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px}
.lang-opt:hover{background:rgba(255,255,255,.05)}
.notif-btn{width:28px;height:28px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;position:relative}
.user-chip{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:18px;padding:3px 4px 3px 9px;cursor:pointer}
.user-chip .uc-name{font-size:11px;font-weight:600;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip .uc-ava{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:14px}
.page{display:none}.page.active{display:block}

/* BOTTOM NAV */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--sidebar);border-top:1px solid var(--border);z-index:30;height:var(--bottom-h)}
.bn-inner{display:flex;height:100%}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);font-size:9px;border:none;background:transparent;padding:5px;transition:color .15s}
.bn-item.active{color:var(--accent)}
.bn-item svg{width:20px;height:20px}
.more-menu{display:none;position:fixed;bottom:var(--bottom-h);left:0;right:0;background:var(--sidebar);border-top:1px solid var(--border);padding:10px;z-index:35}
.more-menu.open{display:block}
.more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.more-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 5px;border-radius:9px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:10px;text-align:center}
.more-item:hover{color:var(--accent);border-color:var(--accent)}
.more-item svg{width:20px;height:20px}

/* DASHBOARD */
.dash-wrap{display:flex;flex-direction:column;gap:14px}
.dash-main-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big-ac{border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:none;color:#fff;transition:all .2s;text-align:left;position:relative;overflow:hidden;width:100%}
.big-ac:active{transform:scale(.97)}
.big-ac .ac-ico{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:22px}
.big-ac .ac-lbl{font-size:13px;font-weight:700;line-height:1.3}
.big-ac .ac-sub{font-size:10px;opacity:.75}
.ac-green{background:linear-gradient(135deg,#15803d,#22c55e);box-shadow:0 4px 20px rgba(34,197,94,.35)}
.ac-pink{background:linear-gradient(135deg,#9d174d,#ec4899);box-shadow:0 4px 20px rgba(236,72,153,.35)}
.ac-orange{background:linear-gradient(135deg,#c2410c,#f97316);box-shadow:0 4px 20px rgba(249,115,22,.35)}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}
.stat-card.sc-blue::before{background:var(--accent)}
.stat-card.sc-green::before{background:var(--green)}
.stat-card.sc-orange::before{background:var(--orange)}
.stat-card.sc-red::before{background:var(--red)}
.stat-ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;margin-bottom:8px}
.stat-lbl{font-size:10px;color:var(--muted);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:700}
.dash-shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shortcut{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .18s;font-size:11px;color:var(--muted);text-align:center}
.shortcut:hover{border-color:rgba(59,130,246,.4);color:var(--accent);background:rgba(59,130,246,.06)}
.shortcut svg{width:22px;height:22px}
.dash-recent{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.section-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}

/* TEXNIKALAR */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.bc-item{cursor:pointer;transition:color .15s}
.bc-item:hover{color:var(--accent)}
.bc-item.active{color:var(--text);font-weight:500}
.bc-sep{color:var(--border)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cat-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .2s;text-align:center;position:relative;overflow:hidden}
.cat-card:hover{border-color:rgba(59,130,246,.4);transform:translateY(-2px)}
.cat-ico{font-size:32px;line-height:1}
.cat-name{font-size:13px;font-weight:600}
.cat-bar{position:absolute;bottom:0;left:0;right:0;height:3px}
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.group-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}
.group-card:hover{border-color:rgba(59,130,246,.4)}
.group-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.dev-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.dev-ico-big{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.dev-info{flex:1;min-width:0}
.dev-name{font-size:13px;font-weight:600}
.dev-id{font-size:10px;color:var(--muted);font-family:monospace;margin-top:1px}
.dev-counts{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.cnt{font-size:10px;padding:2px 6px;border-radius:7px}
.cnt-a{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.cnt-r{background:rgba(249,115,22,.12);color:var(--orange);border:1px solid rgba(249,115,22,.2)}
.cnt-b{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.2)}
.cnt-x{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.cnt-t{background:rgba(59,130,246,.12);color:var(--accent);border:1px solid rgba(59,130,246,.2)}
.stock-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.07);margin-top:6px;display:flex;overflow:hidden}
.sb-g{height:100%;background:var(--green)}
.sb-o{height:100%;background:var(--orange)}
.sb-y{height:100%;background:var(--yellow)}
.dev-act-btn{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.dab-g{background:rgba(34,197,94,.12);color:var(--green)}.dab-g:hover{background:var(--green);color:#fff}
.dab-r{background:rgba(239,68,68,.12);color:var(--red)}.dab-r:hover{background:var(--red);color:#fff}
.dab-b{background:rgba(59,130,246,.12);color:var(--accent)}.dab-b:hover{background:var(--accent);color:#fff}
.add-menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.add-menu-card{background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:16px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:all .18s;text-align:center}
.add-menu-card:hover{border-color:var(--accent);background:rgba(59,130,246,.06)}
.add-menu-ico{font-size:26px}
.add-menu-t{font-size:12.5px;font-weight:600}
.add-menu-s{font-size:10px;color:var(--muted)}

/* SHARED */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9px;font-size:11px;font-weight:500;gap:3px;white-space:nowrap}
.b-g{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25)}
.b-y{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.25)}
.b-r{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.b-b{background:rgba(59,130,246,.12);color:var(--accent);border:1px solid rgba(59,130,246,.25)}
.b-p{background:rgba(139,92,246,.12);color:var(--purple);border:1px solid rgba(139,92,246,.25)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:380px}
th{padding:9px 12px;text-align:left;font-size:10.5px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
td{padding:10px 12px;font-size:12.5px;border-bottom:1px solid rgba(26,40,64,.5);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.012)}
.ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center}
.ava img{width:100%;height:100%;object-fit:cover}
.ab{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .12s}
.ab-g{background:rgba(34,197,94,.12);color:var(--green)}.ab-g:hover{background:var(--green);color:#fff}
.ab-r{background:rgba(239,68,68,.12);color:var(--red)}.ab-r:hover{background:var(--red);color:#fff}
.ab-b{background:rgba(59,130,246,.12);color:var(--accent)}.ab-b:hover{background:var(--accent);color:#fff}
.ab-p{background:rgba(139,92,246,.12);color:var(--purple)}.ab-p:hover{background:var(--purple);color:#fff}
.act-btns{display:flex;gap:4px}
.pg{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.pg-btns{display:flex;gap:3px}
.pg-btn{width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px}
.pg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-prim{background:var(--accent);color:#fff;border:none;padding:7px 12px;border-radius:7px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-weight:500;white-space:nowrap;transition:background .15s}
.btn-prim:hover{background:#2563eb}
.s-inp{background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--text);font-size:12px;outline:none}
.s-inp:focus{border-color:var(--accent)}
.toggle{width:36px;height:19px;border-radius:10px;cursor:pointer;position:relative;border:none;flex-shrink:0;transition:background .2s}
.toggle.on{background:var(--green)}.toggle:not(.on){background:rgba(255,255,255,.1)}
.toggle::after{content:'';width:13px;height:13px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left .2s}
.toggle.on::after{left:20px}.toggle:not(.on)::after{left:3px}
.tg-yes{color:var(--green);font-weight:600}
.tg-no{color:var(--red)}
.tg-chk{display:inline-flex;align-items:center;gap:3px;font-size:11px}

/* IJARA BERISH */
.ijara-layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px}
.panel-title{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:10px}
.inp-wrap{position:relative}
.inp-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
.fi{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px 8px 32px;color:var(--text);font-size:13px;outline:none}
.fi:focus{border-color:var(--accent)}
.fi-plain{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-size:13px;outline:none}
.fi-plain:focus{border-color:var(--accent)}
.client-result-box{background:var(--bg);border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-top:5px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.cri{padding:10px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.cri:last-child{border-bottom:none}
.cri:hover{background:rgba(59,130,246,.08)}
.cri-ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center}
.cri-name{font-size:13px;font-weight:600}
.cri-info{font-size:11px;color:var(--muted);margin-top:1px}
.sel-client-card{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);border-radius:9px;padding:11px;margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dev-item-ijara{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dii-l{display:flex;align-items:center;gap:8px}
.dii-ico{width:26px;height:26px;background:var(--card2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px}
.avail-y{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.3);padding:2px 7px;border-radius:8px;font-size:10px}
.avail-n{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3);padding:2px 7px;border-radius:8px;font-size:10px}
.del-btn{width:22px;height:22px;border-radius:5px;background:rgba(239,68,68,.1);border:none;color:var(--red);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}

.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.form-field.full{grid-column:1/-1}
.form-field label{font-size:10.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:4px}
.form-field label .req{color:var(--red)}
.form-input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;width:100%;transition:border-color .15s}
.form-input:focus{border-color:var(--accent)}
.form-input.error{border-color:var(--red)}
.form-input::placeholder{color:var(--muted)}
.form-select{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;width:100%;cursor:pointer}
.form-select:focus{border-color:var(--accent)}
.form-select option{background:#0f1826}
.form-textarea{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;width:100%;resize:vertical;min-height:60px}

.pass-toggle-row{display:flex;align-items:center;gap:12px;padding:8px 0}

.check-opt input[type=radio]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.check-opt input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.passport-serial-wrap{display:flex;gap:6px}

/* QABUL */
.qabul-grid{display:grid;grid-template-columns:240px 1fr;gap:12px}
.cl-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer;transition:all .15s}

.holat-btn.active-y{border-color:var(--yellow);color:var(--yellow);background:rgba(245,158,11,.1)}
.holat-btn.active-r{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.1)}
.fin-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;font-size:12px}

/* TABS */
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 14px;border:none;background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* REPORT */
.rep-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.rep-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;overflow:hidden}

.rep-card .rc-val{font-size:22px;font-weight:700}
.rep-card::after{content:'';position:absolute;top:0;right:0;bottom:0;width:3px}
.rep-card.rc-total::after{background:var(--accent)}
.rep-card.rc-cash::after{background:var(--green)}
.rep-card.rc-card::after{background:var(--purple)}
.rep-card.rc-transfer::after{background:var(--orange)}
.rep-card.rc-debt::after{background:var(--red)}

.period-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* CHAT */
.chat-layout{display:grid;grid-template-columns:230px 1fr;gap:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;height:calc(100vh - 130px)}
.chat-list{border-right:1px solid var(--border);overflow-y:auto}

.chat-main{display:flex;flex-direction:column;min-width:0}
.chat-head{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.4}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.msg.them{align-self:flex-start;background:var(--card2);border:1px solid var(--border);border-bottom-left-radius:3px}
.msg .mt{font-size:9px;opacity:.6;margin-top:3px;text-align:right}
.chat-input-row{padding:10px;border-top:1px solid var(--border);display:flex;gap:8px}
.chat-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 13px;color:var(--text);font-size:13px;outline:none}
.chat-send{background:var(--accent);border:none;color:#fff;width:42px;border-radius:9px;cursor:pointer;font-size:16px}

/* COMING */
.coming{display:flex;flex-direction:column;align-items:center;justify-content:center;height:280px;color:var(--muted);gap:8px}
.coming .ico{font-size:40px}
.coming .ttl{font-size:15px;font-weight:600;color:var(--text)}

/* CLIENT DETAIL */
.cd-head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.cd-photo{width:72px;height:72px;border-radius:50%;border:2px solid var(--border);object-fit:cover;background:var(--card2);flex-shrink:0}
.cd-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.cd-stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px}
.cd-stat .s-l{font-size:10px;color:var(--muted);margin-bottom:4px}
.cd-stat .s-v{font-size:17px;font-weight:700}

/* TOAST */
.toast{position:fixed;bottom:72px;right:14px;padding:10px 16px;border-radius:9px;font-size:12.5px;font-weight:500;z-index:400;transform:translateY(60px);opacity:0;transition:all .28s;pointer-events:none;max-width:300px}
.toast.show{transform:translateY(0);opacity:1}
.toast-ok{background:#16a34a;color:#fff;box-shadow:0 4px 14px rgba(34,197,94,.3)}
.toast-err{background:#dc2626;color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.3)}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .hamburger{display:flex}
  .kurs{display:none}
  .bottom-nav{display:flex}
  .content{padding:10px;padding-bottom:calc(var(--bottom-h)+10px)}
  .dash-main-btns{grid-template-columns:1fr}
  .dash-stats{grid-template-columns:repeat(2,1fr)}
  .ijara-layout{grid-template-columns:1fr}
  .qabul-grid{grid-template-columns:1fr}
  .form-grid-2{grid-template-columns:1fr}
  .form-grid-3{grid-template-columns:1fr}
  .form-field.full{grid-column:1}
  .toast{bottom:calc(var(--bottom-h)+8px)}
  .cat-grid{grid-template-columns:repeat(2,1fr)}
  .group-grid{grid-template-columns:repeat(2,1fr)}
  .chat-layout{grid-template-columns:1fr;height:calc(100vh - 180px)}
  .chat-list{max-height:140px}
}
</style>
</head>

<script>
/* ================= CALENDAR (reusable) ================= */
const CAL={};
function initCal(key,elId,opts){
  const now=new Date();
  let y=now.getFullYear(),m=now.getMonth();
  CAL[key]={y,m,sel:[],el:elId,opts:opts||{}};
  drawCal(key);
}
function drawCal(key){
  const c=CAL[key];const el=document.getElementById(c.el);if(!el)return;
  const mN=lang==='uz'?mU:mR,now=new Date();
  let years='';for(let y=now.getFullYear()-2;y<=now.getFullYear()+2;y++)years+=`<option value="${y}" ${y===c.y?'selected':''}>${y}</option>`;
  let months=mN.map((mm,i)=>`<option value="${i}" ${i===c.m?'selected':''}>${mm}</option>`).join('');
  let html=`<div class="cal-wrap">
    <div class="cal-hd">
      <div class="cal-today">${T('Bugun','Сегодня')}: <b>${now.getDate()} ${mN[now.getMonth()]} ${now.getFullYear()}</b></div>
      <div class="cal-selects">
        <select class="cal-sel" onchange="CAL['${key}'].m=+this.value;drawCal('${key}')">${months}</select>
        <select class="cal-sel" onchange="CAL['${key}'].y=+this.value;drawCal('${key}')">${years}</select>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <button class="cal-nav" onclick="calMove('${key}',-1)">‹</button>
      <div class="cal-title">${mN[c.m]} ${c.y}</div>
      <button class="cal-nav" onclick="calMove('${key}',1)">›</button>
    </div>
    <div class="cal-g">`;
  const dn=lang==='uz'?['Du','Se','Ch','Pa','Ju','Sh','Ya']:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  dn.forEach(d=>html+=`<div class="cal-dn">${d}</div>`);
  const first=new Date(c.y,c.m,1).getDay(),off=first===0?6:first-1;
  for(let i=0;i<off;i++)html+='<div class="cal-d empty"></div>';
  const days=new Date(c.y,c.m+1,0).getDate(),todayIso=isoOf(now);
  const sorted=c.sel.slice().sort();
  for(let d=1;d<=days;d++){
    const iso=isoDMY(c.y,c.m,d);let cls='cal-d';
    if(iso===todayIso)cls+=' today';
    if(c.sel.includes(iso))cls+=' sel';
    if(c.sel.length===2&&iso>sorted[0]&&iso<sorted[1])cls+=' range';
    if((c.opts.busy||[]).includes(iso))cls+=' busy';
    html+=`<div class="${cls}" onclick="calPick('${key}','${iso}')">${d}</div>`;
  }
  html+='</div>';
  if(c.opts.times){
    html+=`<div class="time-row">
      <div class="time-g"><label>${T('Olib ketish vaqti','Время выдачи')}</label><select class="time-inp" id="cal_${key}_t1"><option>08:00</option><option selected>10:00</option><option>12:00</option><option>14:00</option><option>16:00</option><option>18:00</option></select></div>
      <div class="time-g"><label>${T('Qaytarish vaqti','Время возврата')}</label><select class="time-inp" id="cal_${key}_t2"><option>14:00</option><option>16:00</option><option selected>18:00</option><option>20:00</option></select></div>
    </div>`;
  }
  html+='</div>';
  el.innerHTML=html;
}
function calMove(key,dir){const c=CAL[key];c.m+=dir;if(c.m>11){c.m=0;c.y++}if(c.m<0){c.m=11;c.y--}drawCal(key)}
function calPick(key,iso){const c=CAL[key];if(c.sel.includes(iso))c.sel=c.sel.filter(x=>x!==iso);else{if(c.sel.length>=2)c.sel=[iso];else c.sel.push(iso)}drawCal(key);if(c.opts.onPick)c.opts.onPick()}
function calRange(key){const c=CAL[key];if(!c||!c.sel.length)return null;const s=c.sel.slice().sort();return{from:s[0],to:s[1]||s[0],days:(s[1]?dayDiff(s[0],s[1])+1:1)}}

  }).join('')||`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px">${T('Ijaralar yo\'q','Нет аренд')}</td></tr>`;
