function txSearch(v){renderTx(v)}
function renderDevSearch(v,el){
  const all=allDevs().filter(d=>d.name.toLowerCase().includes(v.toLowerCase())||d.id.toLowerCase().includes(v.toLowerCase()));
  el.innerHTML=all.length?all.map(d=>devHtml(d)).join(''):`<div style="text-align:center;color:var(--muted);padding:40px">${T('Topilmadi','Не найдено')}</div>`;
}
function renderCats(el){
  const all=allDevs();
  const totT=all.reduce((s,d)=>s+d.total,0),totA=all.reduce((s,d)=>s+getAvail(d),0),totR=all.reduce((s,d)=>s+d.rented,0);
  const sumHtml=`<div style="background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px">
    <span style="color:var(--muted)">${T('Kategoriyalar','Категорий')}: <b style="color:var(--accent)">${DB.cats.length}</b></span>
    <span style="color:var(--muted)">${T('Jami','Всего')}: <b>${totT}</b></span>
    <span style="color:var(--muted)">${T('Mavjud','Доступно')}: <b style="color:var(--green)">${totA}</b></span>
    <span style="color:var(--muted)">${T('Ijarada','В аренде')}: <b style="color:var(--orange)">${totR}</b></span></div>`;
  el.innerHTML=sumHtml+(DB.cats.length?`<div class="cat-grid">${DB.cats.map(cat=>{
    const devs=cat.groups.reduce((s,g)=>s+g.devices.length,0);
    const avail=cat.groups.reduce((s,g)=>s+g.devices.reduce((s2,d)=>s2+getAvail(d),0),0);
    const total=cat.groups.reduce((s,g)=>s+g.devices.reduce((s2,d)=>s2+d.total,0),0);
    return `<div class="cat-card" onclick="openCat('${cat.id}')">
      <div class="cat-ico">${cat.ico}</div><div class="cat-name">${getTn(cat)}</div>
      <div style="font-size:10px;color:var(--muted)">${cat.groups.length} ${T('guruh','групп')} · ${devs} ${T('qurilma','устр.')}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:2px"><span class="cnt cnt-a">${T('Mavjud','Дост.')}: ${avail}</span><span class="cnt cnt-t">${T('Jami','Всего')}: ${total}</span></div>
      <div class="cat-bar" style="background:${cat.color};opacity:.6"></div></div>`;
  }).join('')}</div>`:`<div style="text-align:center;color:var(--muted);padding:30px">${T('Kategoriya yo\'q. "+ Qo\'shish" tugmasini bosing','Нет категорий')}</div>`);
}
function openCat(id){txCatId=id;txLevel=1;renderTx('')}
function renderGroups(el){
  const cat=curCat();if(!cat){txLevel=0;return renderTx('')}
  el.innerHTML=cat.groups.length?`<div class="group-grid">${cat.groups.map(g=>{
    const tot=g.devices.reduce((s,d)=>s+d.total,0),avail=g.devices.reduce((s,d)=>s+getAvail(d),0),rent=g.devices.reduce((s,d)=>s+d.rented,0);
    return `<div class="group-card" onclick="openGroup('${g.id}')"><div class="group-ico" style="background:${cat.color}22">${g.ico}</div>
      <div><div style="font-size:13px;font-weight:600">${getTn(g)}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${g.devices.length} ${T('qurilma','устр.')}</div>
      <div style="display:flex;gap:5px;margin-top:5px"><span class="cnt cnt-a">${avail}</span><span class="cnt cnt-r">${rent}</span><span class="cnt cnt-t">${tot}</span></div></div></div>`;
  }).join('')}</div>`:`<div style="text-align:center;color:var(--muted);padding:30px">${T('Guruh yo\'q','Нет групп')}</div>`;
}
function openGroup(id){txGroupId=id;txLevel=2;renderTx('')}
function renderDevices(el){
  const g=curGroup();if(!g){txLevel=1;return renderTx('')}
  el.innerHTML=g.devices.length?g.devices.map(d=>devHtml(d)).join(''):`<div style="text-align:center;color:var(--muted);padding:30px">${T('Texnika yo\'q','Нет техники')}</div>`;
}
function devHtml(d){
  const avail=getAvail(d),pA=d.total?Math.round(avail/d.total*100):0,pR=d.total?Math.round(d.rented/d.total*100):0,pB=d.total?Math.round(d.bron/d.total*100):0;
  return `<div class="dev-card">
    <div class="dev-ico-big" style="background:${avail>0?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)'}">${d.ico}</div>
    <div class="dev-info"><div class="dev-name">${d.name}</div><div class="dev-id">🏷 ${d.id}</div>
      <div class="dev-counts"><span class="cnt cnt-t">${T('Jami','Всего')}: ${d.total}</span><span class="cnt cnt-a">${T('Mavjud','Дост.')}: ${avail}</span>${d.rented?`<span class="cnt cnt-r">${T('Ijara','Арен.')}: ${d.rented}</span>`:''}${d.bron?`<span class="cnt cnt-b">${T('Bron','Бронь')}: ${d.bron}</span>`:''}${d.broken?`<span class="cnt cnt-x">${T('Buzilgan','Слом.')}: ${d.broken}</span>`:''}</div>
      <div class="stock-bar"><div class="sb-g" style="width:${pA}%"></div><div class="sb-o" style="width:${pR}%"></div><div class="sb-y" style="width:${pB}%"></div></div></div>
    <div style="text-align:right"><div style="font-size:12px;font-weight:600;color:var(--green)">${fmtNum(d.price)}</div>
      <div style="display:flex;gap:4px;margin-top:5px;justify-content:flex-end"><button class="dev-act-btn dab-g" onclick="rentD('${d.id}')" title="${T('Ijara','Выдать')}">+</button><button class="dev-act-btn dab-r" onclick="returnD('${d.id}')" title="${T('Qaytarish','Вернуть')}">−</button><button class="dev-act-btn dab-b" onclick="quickEditDev('${d.id}')" title="${T('Tahrir','Изм.')}">✏</button></div></div></div>`;
}
function renderBc(){
  const el=document.getElementById('tx-bc');if(!el)return;
  let h=`<span class="bc-item${txLevel===0?' active':''}" onclick="txGoLevel(0)">${T('Texnikalar','Техника')}</span>`;
  const cat=curCat();if(txLevel>=1&&cat)h+=`<span class="bc-sep">›</span><span class="bc-item${txLevel===1?' active':''}" onclick="txGoLevel(1)">${getTn(cat)}</span>`;
  const g=curGroup();if(txLevel>=2&&g)h+=`<span class="bc-sep">›</span><span class="bc-item active">${getTn(g)}</span>`;
  el.innerHTML=h;
}
function txGoLevel(l){txLevel=l;if(l===0){txCatId=null;txGroupId=null}if(l===1)txGroupId=null;renderTx('')}
function rentD(id){const d=findDev(id);if(!d)return;if(getAvail(d)<=0){showToast(T('Mavjud emas!','Нет в наличии!'),0);return}d.rented++;saveDB();renderTx();showToast(d.name+' '+T('ijaraga berildi','выдано'))}
function returnD(id){const d=findDev(id);if(!d||d.rented<=0){showToast(T('Ijarada yo\'q!','Нет в аренде!'),0);return}d.rented--;saveDB();renderTx();showToast(d.name+' '+T('qaytarildi','возвращено'))}
function quickEditDev(id){const d=findDev(id);if(!d)return;const np=prompt(T('Yangi smena narxi:','Новая цена смены:'),d.price);if(np!==null&&!isNaN(+np)){d.price=+np;saveDB();renderTx();showToast(T('Yangilandi','Обновлено'))}}

/* ===== TEXNIKA QO'SHISH ===== */
function txAddBtn(){document.getElementById('modal-tx-add').classList.add('open')}
function openAddCat(){document.getElementById('cat-name-uz').value='';document.getElementById('cat-name-ru').value='';document.getElementById('cat-ico').value='📦';document.getElementById('modal-cat').classList.add('open')}
function saveCat(){
  const uz=document.getElementById('cat-name-uz').value.trim();if(!uz){showToast(T('Nom kiriting!','Введите название!'),0);return}
  DB.cats.push({id:'c'+Date.now(),ico:document.getElementById('cat-ico').value||'📦',nameUz:uz,nameRu:document.getElementById('cat-name-ru').value.trim()||uz,color:document.getElementById('cat-color').value,groups:[]});
  saveDB();closeModal('cat');txLevel=0;renderTx('');showToast(T('Kategoriya qo\'shildi','Категория добавлена'))
}
function openAddGroup(){
  const sel=document.getElementById('group-cat');
  sel.innerHTML=DB.cats.map(c=>`<option value="${c.id}" ${c.id===txCatId?'selected':''}>${c.ico} ${getTn(c)}</option>`).join('');
  document.getElementById('group-name-uz').value='';document.getElementById('group-name-ru').value='';document.getElementById('group-ico').value='🗂';
  document.getElementById('modal-group').classList.add('open')
}
function saveGroup(){
  const catId=document.getElementById('group-cat').value;const cat=DB.cats.find(c=>c.id===catId);
  const uz=document.getElementById('group-name-uz').value.trim();
  if(!cat||!uz){showToast(T('Kategoriya va nom kiriting!','Заполните поля!'),0);return}
  cat.groups.push({id:'g'+Date.now(),ico:document.getElementById('group-ico').value||'🗂',nameUz:uz,nameRu:document.getElementById('group-name-ru').value.trim()||uz,devices:[]});
  saveDB();closeModal('group');renderTx('');showToast(T('Guruh qo\'shildi','Группа добавлена'))
}
function openAddDev(){
  const sel=document.getElementById('dev-cat');
  sel.innerHTML=DB.cats.map(c=>`<option value="${c.id}" ${c.id===txCatId?'selected':''}>${c.ico} ${getTn(c)}</option>`).join('');
  fillDevGroups();
  document.getElementById('dev-name').value='';document.getElementById('dev-price').value='';document.getElementById('dev-total').value='1';document.getElementById('dev-ico').value='🔧';
  document.getElementById('dev-id').value='DA-'+(DB.devSeq);
  document.getElementById('modal-dev').classList.add('open')
}
function fillDevGroups(){
  const catId=document.getElementById('dev-cat').value;const cat=DB.cats.find(c=>c.id===catId);
  const sel=document.getElementById('dev-group');
  if(!cat||!cat.groups.length){sel.innerHTML=`<option value="">${T('Avval guruh qo\'shing','Сначала добавьте группу')}</option>`;return}
  sel.innerHTML=cat.groups.map(g=>`<option value="${g.id}" ${g.id===txGroupId?'selected':''}>${g.ico} ${getTn(g)}</option>`).join('');
}
function saveDev(){
  const cat=DB.cats.find(c=>c.id===document.getElementById('dev-cat').value);
  const g=cat?cat.groups.find(x=>x.id===document.getElementById('dev-group').value):null;
  const name=document.getElementById('dev-name').value.trim();
  const price=+document.getElementById('dev-price').value;
  const total=+document.getElementById('dev-total').value;
  if(!g||!name||!price||!total){showToast(T('Barcha maydonlarni to\'ldiring!','Заполните все поля!'),0);return}
  let id=document.getElementById('dev-id').value.trim()||('DA-'+DB.devSeq);
  if(findDev(id))id='DA-'+DB.devSeq;
  g.devices.push({id,ico:document.getElementById('dev-ico').value||'🔧',name,price,total,rented:0,bron:0,broken:0});
  DB.devSeq++;saveDB();closeModal('dev');txCatId=cat.id;txGroupId=g.id;txLevel=2;renderTx('');showToast(name+' '+T('qo\'shildi','добавлено'))
}
</script>


<script>
/* ================= MIJOZLAR ================= */
function renderMijozlar(list){
  const d=list||DB.clients,tb=document.getElementById('mj-tbody');if(!tb)return;
  tb.innerHTML=d.map(c=>{
    const st=clientStatus(c);
    const tgHandle=c.tg&&c.tg.handle?c.tg.handle:'';
    let tgCell='';
    if(tgHandle){
      if(c.tg.checked)tgCell=c.tg.exists?`<span class="tg-chk tg-yes">✈️ ✓</span>`:`<span class="tg-chk tg-no">✈️ ✕</span>`;
      else tgCell=`<button class="ab ab-b" style="width:auto;padding:2px 7px;border-radius:7px;font-size:10px" onclick="checkTgRow('${c.id}')">✈️ ${T('Tekshir','Пров.')}</button>`;
    }else tgCell='<span style="color:var(--muted);font-size:10px">—</span>';
    const ava=c.photo?`<div class="ava"><img src="${c.photo}"></div>`:`<div class="ava">${c.ism[0]}</div>`;
    return `<tr>
      <td>${ava}</td>
      <td style="font-weight:500;white-space:nowrap;cursor:pointer" onclick="openDetail('${c.id}')">${clientFullName(c)}${c.discount?` <span class="badge b-p" style="font-size:9px">-${c.discount}%</span>`:''}</td>
      <td style="font-size:11px"><div style="color:var(--yellow)">${(c.phones[0]||{}).num||'—'}</div>${tgCell}</td>
      <td style="font-size:11px">${c.pass.bor?c.pass.turi+' <span style="color:var(--yellow);font-family:monospace">'+c.pass.serial+'</span>':'<span style="color:var(--muted)">'+T('Yo\'q','Нет')+'</span>'}</td>
      <td style="font-size:11px">${c.pass.joy==='ofisda'?'<span style="color:var(--green)">'+T('Ofisda','В офисе')+'</span>':'<span style="color:var(--yellow)">'+T('O\'zida','У клиента')+'</span>'}</td>
      <td><span class="badge ${st.badge}" style="font-size:10px">● ${lang==='uz'?st.uz:st.ru}</span></td>
      <td><div class="act-btns">
        <button class="ab ab-b" onclick="openDetail('${c.id}')">👁</button>
        <button class="ab ab-b" onclick="editMijoz('${c.id}')">✏</button>
        <button class="ab ${c.blacklist?'ab-g':'ab-r'} admin-only" onclick="toggleBlacklist('${c.id}')" title="${T('Qora ro\'yxat','Чёрный список')}">${c.blacklist?'↩':'🚫'}</button>
      </div></td></tr>`;
  }).join('')||`<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">${T('Mijoz yo\'q','Нет клиентов')}</td></tr>`;
  const cnt=document.getElementById('mj-count');if(cnt)cnt.textContent=T('Jami','Всего')+': '+d.length;
  document.body.classList.toggle('is-admin',currentUser&&currentUser.role==='admin');
}
function filterMijoz(v){v=v.toLowerCase();renderMijozlar(DB.clients.filter(c=>clientFullName(c).toLowerCase().includes(v)||c.phones.some(p=>p.num.includes(v))||(c.pass.serial||'').toLowerCase().includes(v)||(c.tg.handle||'').toLowerCase().includes(v)))}
function checkTgRow(id){const c=findClient(id);if(!c)return;c.tg.checked=true;c.tg.exists=tgCheck(c.tg.handle);saveDB();renderMijozlar();showToast(c.tg.exists?T('Telegram bor ✓','Телеграм есть ✓'):T('Telegram topilmadi','Телеграм не найден'),c.tg.exists?1:0)}
function toggleBlacklist(id){const c=findClient(id);if(!c)return;c.blacklist=!c.blacklist;saveDB();renderMijozlar();renderBlacklist();showToast(c.blacklist?T('Qora ro\'yxatga qo\'shildi','Добавлен в ЧС'):T('Qora ro\'yxatdan chiqarildi','Убран из ЧС'),c.blacklist?0:1)}

/* ===== MODAL: yangi/tahrir ===== */
let editingClientId=null;
let mjPhotoData=null;
function initBirthdaySelects(){
  const dS=document.getElementById('f-bd-day'),mS=document.getElementById('f-bd-month'),yS=document.getElementById('f-bd-year');
  if(!dS)return;
  dS.innerHTML='<option value="">'+T('Kun','День')+'</option>';for(let i=1;i<=31;i++)dS.innerHTML+=`<option value="${i}">${i}</option>`;
  mS.innerHTML='<option value="">'+T('Oy','Месяц')+'</option>';(lang==='uz'?mU:mR).forEach((m,i)=>mS.innerHTML+=`<option value="${i+1}">${m}</option>`);
  yS.innerHTML='<option value="">'+T('Yil','Год')+'</option>';const ny=new Date().getFullYear();for(let y=ny;y>=ny-90;y--)yS.innerHTML+=`<option value="${y}">${y}</option>`;
}
function openNewMijoz(){
  editingClientId=null;mjPhotoData=null;
  document.getElementById('mj-modal-title').textContent=T("Yangi mijoz qo'shish","Добавление клиента");
  ['f-ism','f-familiya','f-otasi','f-jshshir','f-ps-letters','f-ps-numbers','f-pass-izoh','f-taklif','f-details','f-tg'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});
  document.getElementById('f-jinsi').value='';document.getElementById('f-pass-turi').value='ID karta';document.getElementById('f-pass-joy').value='ozida';
  document.getElementById('f-bd-day').value='';document.getElementById('f-bd-month').value='';document.getElementById('f-bd-year').value='';
  document.getElementById('pass-bor').checked=true;togglePassFields(1);
  document.getElementById('f-tg-res').innerHTML='';
  document.getElementById('mj-photo-prev').src='';
  document.getElementById('phone-rows-modal').innerHTML='';addPhoneRow();
  document.getElementById('modal-mijoz').classList.add('open');
}
function editMijoz(id){
  const c=findClient(id);if(!c)return;
  editingClientId=id;mjPhotoData=c.photo||null;
  document.getElementById('mj-modal-title').textContent=T("Mijozni tahrirlash","Редактирование клиента");
  document.getElementById('f-ism').value=c.ism;document.getElementById('f-familiya').value=c.familiya;document.getElementById('f-otasi').value=c.otasi||'';
  document.getElementById('f-jinsi').value=c.jinsi||'';document.getElementById('f-jshshir').value=c.jshshir||'';
  if(c.bd){const p=c.bd.split('-');document.getElementById('f-bd-year').value=p[0];document.getElementById('f-bd-month').value=+p[1];document.getElementById('f-bd-day').value=+p[2]}
  else{document.getElementById('f-bd-day').value='';document.getElementById('f-bd-month').value='';document.getElementById('f-bd-year').value=''}
  document.getElementById('pass-bor').checked=c.pass.bor;document.getElementById('pass-yoq').checked=!c.pass.bor;togglePassFields(c.pass.bor?1:0);
  document.getElementById('f-ps-letters').value=(c.pass.serial||'').slice(0,2);document.getElementById('f-ps-numbers').value=(c.pass.serial||'').slice(2);
  document.getElementById('f-pass-turi').value=c.pass.turi||'ID karta';document.getElementById('f-pass-joy').value=c.pass.joy||'ozida';document.getElementById('f-pass-izoh').value=c.pass.izoh||'';
  document.getElementById('f-tg').value=c.tg.handle||'';document.getElementById('f-tg-res').innerHTML=c.tg.checked?(c.tg.exists?`<span class="tg-yes">✈️ ${T('Telegram bor','Телеграм есть')} ✓</span>`:`<span class="tg-no">✈️ ${T('Topilmadi','Не найден')}</span>`):'';
  document.getElementById('f-taklif').value=c.taklif||'';document.getElementById('f-details').value=c.details||'';
  document.getElementById('mj-photo-prev').src=c.photo||'';
  document.getElementById('phone-rows-modal').innerHTML='';
  (c.phones.length?c.phones:[{type:"O'zi",num:'',kafil:false}]).forEach(p=>addPhoneRow(p));
  document.getElementById('modal-mijoz').classList.add('open');
}
function togglePassFields(bor){document.getElementById('pass-fields').style.display=bor?'block':'none'}
function loadPhoto(inp,which){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{mjPhotoData=e.target.result;document.getElementById('mj-photo-prev').src=mjPhotoData};
  r.readAsDataURL(f);
}
function checkTgInModal(){
  const h=document.getElementById('f-tg').value.trim();
  if(!h){document.getElementById('f-tg-res').innerHTML=`<span class="tg-no">${T('Username/tel kiriting','Введите username/тел')}</span>`;return}
  const ex=tgCheck(h);
  document.getElementById('f-tg-res').innerHTML=ex?`<span class="tg-yes">✈️ ${T('Telegram bor','Телеграм есть')} ✓</span>`:`<span class="tg-no">✈️ ${T('Telegram topilmadi','Не найден')} ✕</span>`;
}
function openTaklif(){filterTaklif(document.getElementById('f-taklif').value)}
function filterTaklif(v){
  const drop=document.getElementById('taklif-drop');
  const f=DB.clients.filter(c=>!v||clientFullName(c).toLowerCase().includes(v.toLowerCase()));
  if(!f.length){drop.classList.remove('open');return}
  drop.innerHTML=f.map(c=>`<div class="taklif-item" onclick="selTaklif('${clientFullName(c).replace(/'/g,"\\'")}')"><div class="taklif-ava">${c.ism[0]}</div><div><div style="font-size:12.5px;font-weight:500">${clientFullName(c)}</div><div style="font-size:10px;color:var(--muted)">${c.id} · ${(c.phones[0]||{}).num||''}</div></div></div>`).join('');
  drop.classList.add('open');
}
function selTaklif(name){document.getElementById('f-taklif').value=name;closeTaklif()}
function closeTaklif(){const d=document.getElementById('taklif-drop');if(d)d.classList.remove('open')}
function fmtPhone(inp){
  let v=inp.value.replace(/\D/g,'');if(v.startsWith('998'))v=v.slice(3);
  if(v.length>2&&v.length<=5)v=v.slice(0,2)+' '+v.slice(2);
  else if(v.length>5&&v.length<=7)v=v.slice(0,2)+' '+v.slice(2,5)+' '+v.slice(5);
  else if(v.length>7)v=v.slice(0,2)+' '+v.slice(2,5)+' '+v.slice(5,7)+' '+v.slice(7,9);
  inp.value=v;
}
function toggleKafil(el){el.classList.toggle('active')}
function addPhoneRow(data){
  const r=document.createElement('div');r.className='phone-row';
  const types=[["O'zi",'Свой'],['Ota','Отец'],['Ona','Мать'],['Aka/uka','Брат'],['Ish joyi','Работа'],['Boshqa','Другое']];
  const opts=types.map(t=>`<option ${data&&data.type===t[0]?'selected':''}>${lang==='uz'?t[0]:t[1]}</option>`).join('');
  r.innerHTML=`<select class="phone-type-sel">${opts}</select>
    <input class="phone-num-inp" placeholder="+998 90 000 00 00" value="${data?data.num:''}" oninput="fmtPhone(this)">
    <div class="kafil-check ${data&&data.kafil?'active':''}" onclick="toggleKafil(this)" title="Kafil">K</div>
    <button class="rem-phone-btn" onclick="if(document.querySelectorAll('#phone-rows-modal .phone-row').length>1)this.closest('.phone-row').remove()">−</button>`;
  document.getElementById('phone-rows-modal').appendChild(r);
}
function saveMijoz(){
  const ism=document.getElementById('f-ism').value.trim(),familiya=document.getElementById('f-familiya').value.trim();
  if(!ism||!familiya){showToast(T('Ism va Familiya majburiy!','Имя и Фамилия обязательны!'),0);return}
  const passBor=document.getElementById('pass-bor').checked;
  const letters=document.getElementById('f-ps-letters').value.trim(),numbers=document.getElementById('f-ps-numbers').value.trim();
  if(passBor&&(letters.length!==2||numbers.length!==7)){showToast(T('Pasport: 2 harf + 7 raqam!','Паспорт: 2 буквы + 7 цифр!'),0);return}
  const phones=[];document.querySelectorAll('#phone-rows-modal .phone-row').forEach(r=>{const num=r.querySelector('.phone-num-inp').value.trim();if(num)phones.push({type:r.querySelector('.phone-type-sel').value,num,kafil:r.querySelector('.kafil-check').classList.contains('active')})});
  const bdY=document.getElementById('f-bd-year').value,bdM=document.getElementById('f-bd-month').value,bdD=document.getElementById('f-bd-day').value;
  const bd=(bdY&&bdM&&bdD)?bdY+'-'+String(bdM).padStart(2,'0')+'-'+String(bdD).padStart(2,'0'):'';
  const tgHandle=document.getElementById('f-tg').value.trim();
  const data={
    ism,familiya,otasi:document.getElementById('f-otasi').value.trim(),jinsi:document.getElementById('f-jinsi').value,bd,
    jshshir:document.getElementById('f-jshshir').value.trim(),
    pass:{bor:passBor,turi:passBor?document.getElementById('f-pass-turi').value:'',serial:passBor?letters+numbers:'',joy:document.getElementById('f-pass-joy').value,izoh:document.getElementById('f-pass-izoh').value.trim()},
    tg:{handle:tgHandle,checked:false,exists:false},
    phones:phones.length?phones:[{type:"O'zi",num:'',kafil:false}],
    taklif:document.getElementById('f-taklif').value.trim(),
    details:document.getElementById('f-details').value.trim(),
    photo:mjPhotoData
  };
  // TG holati
  if(tgHandle){data.tg.checked=true;data.tg.exists=tgCheck(tgHandle)}
  if(editingClientId){
    const c=findClient(editingClientId);
    Object.assign(c,data);if(mjPhotoData&&mjPhotoData!==c.photo)c.photoDate=isoToday();
    if(mjPhotoData)c.photoDate=isoToday();
    saveDB();renderMijozlar();showToast(clientFullName(c)+' '+T('yangilandi','обновлён'));
  }else{
    const id='MJ-'+String(DB.clientSeq++).padStart(3,'0');
    DB.clients.push(Object.assign({id,blacklist:false,discount:0,lastRental:'',qarzi:0,history:[],broken:[],photoDate:mjPhotoData?isoToday():null},data));
    saveDB();renderMijozlar();showToast(familiya+' '+ism+' '+T('qo\'shildi','добавлен'));
  }
  closeModal('mijoz');
}

/* ===== MIJOZ KARTOCHKASI ===== */
function openDetail(id){
  const c=findClient(id);if(!c)return;
  const st=clientStatus(c);
  const totalProfit=(c.history||[]).reduce((s,h)=>s+(h.total||0),0);
  const ny=new Date().getFullYear();
  const yearProfit=(c.history||[]).filter(h=>h.date&&h.date.startsWith(ny)).reduce((s,h)=>s+(h.total||0),0);
  const monthKey=isoToday().slice(0,7);
  const monthProfit=(c.history||[]).filter(h=>h.date&&h.date.startsWith(monthKey)).reduce((s,h)=>s+(h.total||0),0);
  const photoOld=c.photoDate&&monthsSince(c.photoDate)>6;
  const ava=c.photo?`<img class="cd-photo" src="${c.photo}">`:`<div class="cd-photo" style="display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1d4ed8,#7c3aed)">${c.ism[0]}</div>`;
  const tgBadge=c.tg.handle?(c.tg.checked?(c.tg.exists?`<span class="tg-yes">✈️ ${c.tg.handle} ✓</span>`:`<span class="tg-no">✈️ ${c.tg.handle} ✕</span>`):`<span style="color:var(--muted)">✈️ ${c.tg.handle} (?)</span>`):'';
  document.getElementById('detail-body').innerHTML=`
    <div class="cd-head">
      ${ava}
      <div style="flex:1">
        <div style="font-size:18px;font-weight:700">${clientFullName(c)} ${c.otasi||''}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${c.id} · ${c.jinsi||''} ${c.bd?'· '+fmtDate(c.bd):''}</div>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <span class="badge ${st.badge}">● ${lang==='uz'?st.uz:st.ru}</span>
          ${c.discount?`<span class="badge b-p">${T('Skidka','Скидка')} ${c.discount}%</span>`:''}
          ${tgBadge}
        </div>
      </div>
    </div>
    ${photoOld?`<div class="blk-warn" style="background:rgba(245,158,11,.12);border-color:var(--yellow);color:var(--yellow)">⚠ ${T('Rasm 6 oydan eski — yangilang','Фото старше 6 мес — обновите')}</div>`:''}
    ${c.blacklist?`<div class="blk-warn">🚫 ${T('Bu mijoz QORA RO\'YXATDA','Клиент в ЧЁРНОМ СПИСКЕ')}</div>`:''}
    <div class="cd-stats">
      <div class="cd-stat"><div class="s-l">${T('Jami ijaralar','Всего аренд')}</div><div class="s-v" style="color:var(--accent)">${(c.history||[]).length}</div></div>
      <div class="cd-stat"><div class="s-l">${T('Qarzdorlik','Долг')}</div><div class="s-v" style="color:${c.qarzi>0?'var(--red)':'var(--green)'}">${fmtNum(c.qarzi)}</div></div>
      <div class="cd-stat"><div class="s-l">${T('Bu oy foyda','Прибыль за месяц')}</div><div class="s-v" style="color:var(--green)">${fmtNum(monthProfit)}</div></div>
      <div class="cd-stat"><div class="s-l">${T('Bu yil foyda','Прибыль за год')}</div><div class="s-v" style="color:var(--green)">${fmtNum(yearProfit)}</div></div>
      <div class="cd-stat"><div class="s-l">${T('Umumiy foyda','Общая прибыль')}</div><div class="s-v">${fmtNum(totalProfit)}</div></div>
    </div>
    <div class="form-section">
      <div class="form-section-title">🪪 ${T('Passport','Паспорт')}</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px">
        ${c.pass.bor?`<span class="badge b-b">${c.pass.turi} ${c.pass.serial}</span>`:`<span class="badge b-y">${T('Pasport yo\'q','Нет паспорта')}</span>`}
        <span>${T('Joylashuvi','Где')}:</span>
        <select class="form-select" style="width:auto" onchange="updatePassJoy('${c.id}',this.value)">
          <option value="ozida" ${c.pass.joy==='ozida'?'selected':''}>${T('Mijoz o\'zida','У клиента')}</option>
          <option value="ofisda" ${c.pass.joy==='ofisda'?'selected':''}>${T('Ofisda (garovda)','В офисе')}</option>
        </select>
        ${c.pass.bor?`<select class="form-select" style="width:auto" onchange="updatePassTuri('${c.id}',this.value)">
          ${['ID karta','Pasport','Zagran','Chet el','Prava'].map(t=>`<option ${c.pass.turi===t?'selected':''}>${t}</option>`).join('')}
        </select>`:''}
      </div>
    </div>
    <div class="form-section">
      <div class="form-section-title">📱 ${T('Telefonlar','Телефоны')}</div>
      ${c.phones.map(p=>`<div class="fin-row"><span>${p.type}: <b style="color:var(--yellow)">${p.num}</b></span>${p.kafil?`<span class="badge b-p">${T('Kafil','Поручитель')}</span>`:''}</div>`).join('')}
    </div>
    <div class="form-section">
      <div class="form-section-title">📜 ${T('Ijara tarixi','История аренды')}</div>
      ${(c.history||[]).length?`<div class="tbl-wrap"><table><thead><tr><th>${T('Sana','Дата')}</th><th>${T('Texnika','Техника')}</th><th>${T('Kun','Дней')}</th><th>${T('Summa','Сумма')}</th><th>${T('Holat','Статус')}</th></tr></thead><tbody>${c.history.map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${h.devices}</td><td>${h.days}</td><td style="color:var(--green)">${fmtNum(h.total)}</td><td>${h.status==='ijarada'?`<span class="badge b-b">${T('Ijarada','В аренде')}</span>`:`<span class="badge b-g">${T('Qaytarilgan','Возвращено')}</span>`}</td></tr>`).join('')}</tbody></table></div>`:`<div style="color:var(--muted);font-size:12px">${T('Tarix yo\'q','Нет истории')}</div>`}
    </div>
    ${(c.broken||[]).length?`<div class="form-section"><div class="form-section-title" style="color:var(--red)">🔧 ${T('Buzilgan/Yo\'qotilgan','Поломки/Утеря')}</div>${c.broken.map(b=>`<div class="fin-row"><span>${b.device} <span style="color:var(--muted)">${fmtDate(b.date)}</span> ${b.note?'· '+b.note:''}</span><span style="color:var(--red)">−${fmtNum(b.amount)}</span></div>`).join('')}</div>`:''}
    <div class="form-section">
      <div class="form-section-title">🎁 ${T('Skidka belgilash','Назначить скидку')}</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input class="form-input" type="number" id="cd-discount" value="${c.discount||0}" min="0" max="100" style="width:120px"> <span>%</span>
        <button class="btn-prim" onclick="saveDiscount('${c.id}')">${T('Saqlash','Сохранить')}</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-do" onclick="closeModal('detail');editMijoz('${c.id}')">✏ ${T('Tahrirlash','Редактировать')}</button>
      <button class="btn-prim" style="background:var(--green)" onclick="closeModal('detail');ijFromClient('${c.id}')">+ ${T('Ijara berish','Выдать')}</button>
      <button class="${c.blacklist?'btn-prim':'btn-sec'} admin-only" onclick="toggleBlacklist('${c.id}');closeModal('detail')">${c.blacklist?'↩ '+T('Oqlash','Из ЧС'):'🚫 '+T('Qora ro\'yxat','В ЧС')}</button>
    </div>`;
  document.getElementById('modal-detail').classList.add('open');
  document.body.classList.toggle('is-admin',currentUser&&currentUser.role==='admin');
}
function updatePassJoy(id,v){const c=findClient(id);if(!c)return;c.pass.joy=v;saveDB();renderMijozlar();showToast(T('Pasport joyi yangilandi','Обновлено'))}
function updatePassTuri(id,v){const c=findClient(id);if(!c)return;c.pass.turi=v;saveDB();renderMijozlar();showToast(T('Pasport turi yangilandi','Обновлено'))}
function saveDiscount(id){const c=findClient(id);if(!c)return;c.discount=Math.max(0,Math.min(100,+document.getElementById('cd-discount').value||0));saveDB();renderMijozlar();showToast(T('Skidka saqlandi','Скидка сохранена'))}
</script>


<script>
/* ================= IJARAGA BERISH ================= */
let ijClients=[];   // tanlangan mijozlar (ko'p)
let ijDevs=[];      // tanlangan texnikalar [{id,name,price,ico}]
function initIjaraPage(){
  ijClients=[];ijDevs=[];
  document.getElementById('ij-cs').value='';document.getElementById('ij-cr').innerHTML='';
  document.getElementById('ij-ds').value='';document.getElementById('ij-dr').innerHTML='';
  document.getElementById('ij-days').value='1';document.getElementById('ij-avans').value='';
  renderIjClients();renderIjDevs();
  initCal('ij','ij-cal',{times:true,onPick:ijOnPick});
  ijCalcSum();
}
function ijFromClient(id){nav('ijara',null);setTimeout(()=>{const c=findClient(id);if(c){ijAddClient(id)}},50)}
function ijOnPick(){const r=calRange('ij');if(r){document.getElementById('ij-days').value=r.days}ijCalcSum()}
function ijSearchClient(v){
  const res=document.getElementById('ij-cr');if(!res)return;
  if(!v.trim()){res.innerHTML='';return}
  const f=DB.clients.filter(c=>clientFullName(c).toLowerCase().includes(v.toLowerCase())||c.phones.some(p=>p.num.includes(v))||(c.pass.serial||'').toLowerCase().includes(v));
  if(!f.length){res.innerHTML=`<div style="padding:10px;color:var(--muted);font-size:12px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-top:5px">${T('Mijoz topilmadi','Не найдено')}</div>`;return}
  res.innerHTML=`<div class="client-result-box">${f.map(c=>{const st=clientStatus(c);return `
    <div class="cri" onmousedown="ijAddClient('${c.id}')">
      <div class="cri-ava">${c.photo?`<img src="${c.photo}">`:c.ism[0]}</div>
      <div style="flex:1;min-width:0"><div class="cri-name">${clientFullName(c)}</div>
        <div class="cri-info">${c.id} · ${(c.phones[0]||{}).num||''} · ${c.pass.bor?c.pass.turi+' '+c.pass.serial:T('pasportsiz','без пасп.')}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0">
        ${c.blacklist?`<span class="badge b-r" style="font-size:9px">🚫 ${T('Qora ro\'yxat','ЧС')}</span>`:`<span class="badge ${st.badge}" style="font-size:9px">${lang==='uz'?st.uz:st.ru}</span>`}
        ${c.qarzi>0?`<span style="font-size:10px;color:var(--red)">⚠ ${fmtNum(c.qarzi)}</span>`:''}
      </div></div>`}).join('')}</div>`;
}
function ijAddClient(id){
  if(ijClients.includes(id)){showToast(T('Bu mijoz allaqachon tanlangan','Уже выбран'),0);return}
  const c=findClient(id);if(!c)return;
  ijClients.push(id);
  document.getElementById('ij-cs').value='';document.getElementById('ij-cr').innerHTML='';
  renderIjClients();
  if(c.blacklist)showToast('🚫 '+clientFullName(c)+' '+T('QORA RO\'YXATDA!','в ЧЁРНОМ СПИСКЕ!'),0);
}
function ijRemoveClient(id){ijClients=ijClients.filter(x=>x!==id);renderIjClients()}
function renderIjClients(){
  const cc=document.getElementById('ij-cc');
  if(!ijClients.length){cc.innerHTML='';return}
  cc.innerHTML=ijClients.map(id=>{const c=findClient(id);if(!c)return'';const blk=c.blacklist;
    return `<div class="sel-client-card" style="${blk?'border-color:var(--red);background:rgba(239,68,68,.08)':''}">
      <div style="display:flex;align-items:center;gap:9px;flex:1;min-width:0">
        <div class="cri-ava" style="width:34px;height:34px">${c.photo?`<img src="${c.photo}">`:c.ism[0]}</div>
        <div><div style="font-weight:600;font-size:13px">${clientFullName(c)} ${blk?'🚫':''}</div>
          <div style="font-size:11px;color:var(--muted)">${c.id} · ${(c.phones[0]||{}).num||''} ${c.discount?'· '+T('skidka','скидка')+' '+c.discount+'%':''}</div>
          ${blk?`<div style="font-size:11px;color:var(--red);font-weight:600">${T('Diqqat: qora ro\'yxatda!','Внимание: в ЧС!')}</div>`:''}
          ${c.qarzi>0?`<div style="font-size:11px;color:var(--red)">⚠ ${T('Qarzi','Долг')}: ${fmtNum(c.qarzi)}</div>`:''}
        </div></div>
      <button onclick="ijRemoveClient('${id}')" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:11px;flex-shrink:0">✕</button>
    </div>`}).join('');
}
function ijSearchDev(v){
  const res=document.getElementById('ij-dr');if(!res)return;
  if(!v.trim()){res.innerHTML='';return}
  const f=allDevs().filter(d=>d.name.toLowerCase().includes(v.toLowerCase())||d.id.toLowerCase().includes(v.toLowerCase()));
  res.innerHTML=f.length?`<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:7px">${f.map(d=>{const av=getAvail(d);return `<div style="padding:9px 11px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid var(--border)" onmousedown="ijAddDev('${d.id}')">
    <span style="font-size:16px">${d.ico}</span><div style="flex:1"><div style="font-size:12.5px;font-weight:500">${d.name}</div><div style="font-size:10px;color:var(--muted)">${d.id} · ${fmtNum(d.price)} so'm/${T('kun','день')}</div></div>
    <span class="${av>0?'avail-y':'avail-n'}">${av>0?av+' ✓':T('Yo\'q','Нет')}</span></div>`}).join('')}</div>`:`<div style="padding:9px;color:var(--muted);font-size:12px;text-align:center">${T('Topilmadi','Не найдено')}</div>`;
}
function ijAddDev(id){
  if(ijDevs.find(d=>d.id===id)){showToast(T('Allaqachon tanlangan','Уже выбран'),0);return}
  const d=findDev(id);if(!d)return;
  if(getAvail(d)<=0){showToast(T('Mavjud emas!','Нет в наличии!'),0);return}
  ijDevs.push({id:d.id,name:d.name,price:d.price,ico:d.ico});
  document.getElementById('ij-ds').value='';document.getElementById('ij-dr').innerHTML='';
  renderIjDevs();ijCalcSum();
}
function ijRemoveDev(id){ijDevs=ijDevs.filter(d=>d.id!==id);renderIjDevs();ijCalcSum()}
function renderIjDevs(){
  const cont=document.getElementById('ij-devs');
  cont.innerHTML=ijDevs.map(d=>{const dev=findDev(d.id);const av=dev?getAvail(dev):0;return `<div class="dev-item-ijara">
    <div class="dii-l"><div class="dii-ico">${d.ico}</div><div><div style="font-size:12px;font-weight:500">${d.name}</div><div style="font-size:10px;color:var(--muted)">${d.id} · ${fmtNum(d.price)} so'm</div></div></div>
    <div style="display:flex;gap:5px;align-items:center"><span class="${av>0?'avail-y':'avail-n'}">${av>0?av+' ✓':T('Yo\'q','Нет')}</span><button class="del-btn" onclick="ijRemoveDev('${d.id}')">✕</button></div></div>`}).join('')||`<div style="font-size:11px;color:var(--muted);padding:6px">${T('Texnika tanlanmagan','Техника не выбрана')}</div>`;
}
function ijCalcSum(){
  const days=Math.max(1,+document.getElementById('ij-days').value||1);
  const base=ijDevs.reduce((s,d)=>s+d.price,0)*days;
  let disc=0;if(ijClients.length){const c=findClient(ijClients[0]);if(c)disc=c.discount||0}
  const total=Math.round(base*(1-disc/100));
  document.getElementById('ij-sum').textContent=fmtMoney(total)+(disc?` (-${disc}%)`:'');
  return total;
}
function setPay(btn){btn.closest('.pay-row').querySelectorAll('.pay-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function getPay(scope){const el=document.querySelector(scope+' .pay-btn.active');return el?el.getAttribute('data-pay'):'naxt'}
function doIjara(){
  if(!ijClients.length){showToast(T('Mijoz tanlang!','Выберите клиента!'),0);return}
  if(!ijDevs.length){showToast(T('Texnika tanlang!','Выберите технику!'),0);return}
  const blk=ijClients.map(id=>findClient(id)).find(c=>c&&c.blacklist);
  if(blk){if(!confirm('🚫 '+clientFullName(blk)+' '+T('qora ro\'yxatda! Davom etasizmi?','в ЧС! Продолжить?')))return}
  const r=calRange('ij');
  const days=Math.max(1,+document.getElementById('ij-days').value||1);
  const dateOut=r?r.from:isoToday();
  const dateIn=r&&r.to!==r.from?r.to:isoOf(new Date(new Date(dateOut).getTime()+days*86400000));
  const timeOut=(document.getElementById('cal_ij_t1')||{}).value||'10:00';
  const timeIn=(document.getElementById('cal_ij_t2')||{}).value||'18:00';
  const pay=getPay('#page-ijara');
  const avans=+document.getElementById('ij-avans').value||0;
  const total=ijCalcSum();
  const names=ijClients.map(id=>clientFullName(findClient(id))).join(', ');
  ijDevs.forEach(d=>{
    const dev=findDev(d.id);if(dev&&getAvail(dev)>0)dev.rented++;
    const rid='R-'+Math.floor(1000+Math.random()*9000);
    DB.rentals.push({id:rid,clientIds:ijClients.slice(),clientNames:names,devId:d.id,devName:d.name,price:d.price,days,dateOut,dateIn,timeOut,timeIn,pay,avans:Math.round(avans/ijDevs.length),total:Math.round(total/ijDevs.length),status:'active'});
  });
  // mijoz tarixi + lastRental
  ijClients.forEach(id=>{const c=findClient(id);if(c){c.lastRental=dateOut;c.history.push({date:dateOut,devices:ijDevs.map(d=>d.name).join(', '),days,total:Math.round(total/ijClients.length),status:'ijarada'})}});
  // tranzaksiya (avans)
  if(avans>0)DB.txns.push({id:'T'+Date.now(),date:isoToday(),clientName:names,kind:'avans',pay,amount:avans});
  saveDB();
  showToast(T('Ijaraga chiqarildi!','Выдано в аренду!'));
  nav('ijarada',null);
}

/* ================= QABUL ================= */
let qbSelRental=null;
function renderQabul(){renderQabulList('')}
function renderQabulList(v){
  const list=document.getElementById('qb-list');if(!list)return;
  let act=DB.rentals.filter(r=>r.status==='active');
  if(v)act=act.filter(r=>r.clientNames.toLowerCase().includes(v.toLowerCase())||r.devName.toLowerCase().includes(v.toLowerCase()));
  list.innerHTML=act.length?act.map(r=>`<div class="cl-item ${qbSelRental===r.id?'sel':''}" onclick="qbSelect('${r.id}')">
    <div style="font-size:13px;font-weight:600">${r.clientNames}</div>
    <div style="font-size:11px;color:var(--accent)">${r.devName} · ${fmtDate(r.dateOut)}</div></div>`).join(''):`<div style="color:var(--muted);font-size:12px;padding:14px;text-align:center">${T('Faol ijara yo\'q','Нет активных')}</div>`;
  if(!qbSelRental&&act.length)qbSelect(act[0].id);
  else if(qbSelRental)renderQabulDetail();
  else document.getElementById('qb-detail').innerHTML='';
}
function qbSelect(id){qbSelRental=id;renderQabulList(document.getElementById('qb-search').value);renderQabulDetail()}
function renderQabulDetail(){
  const r=DB.rentals.find(x=>x.id===qbSelRental);const box=document.getElementById('qb-detail');if(!r){box.innerHTML='';return}
  const tolanadi=Math.max(0,r.total-(r.avans||0));
  box.innerHTML=`<div class="panel">
      <div style="font-weight:600;margin-bottom:8px">${r.clientNames}</div>
      <div class="dev-item-ijara"><div class="dii-l"><div class="dii-ico">📷</div><div><div style="font-size:12px;font-weight:500">${r.devName}</div><div style="font-size:10px;color:var(--muted)">${r.devId} · ${fmtNum(r.price)} · ${r.days} ${T('kun','дн.')} · ${fmtDate(r.dateOut)}→${fmtDate(r.dateIn)}</div></div></div><div style="font-size:13px;font-weight:600;color:var(--green)">${fmtNum(r.total)}</div></div>
      <div style="font-size:11px;color:var(--muted);margin-top:10px;margin-bottom:4px">${T('Texnika holati:','Состояние техники:')}</div>
      <div class="holat-row">
        <button class="holat-btn active-g" onclick="setH(this,'g')">${T('Sog\'lom','Целая')}</button>
        <button class="holat-btn" onclick="setH(this,'y')">${T('Yengil shikast','Лёгкое ⚠')}</button>
        <button class="holat-btn" onclick="setH(this,'r')">${T('Jiddiy/Yo\'qotilgan','Поломка/Утеря ⛔')}</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:6px">
        <input class="fi-plain" id="qb-izoh" placeholder="${T('Izoh...','Коммент...')}" style="font-size:12px">
        <input class="fi-plain" id="qb-jarima" placeholder="${T('Jarima','Штраф')}" type="number" style="width:100px;font-size:12px;text-align:right">
      </div>
    </div>
    <div style="margin-top:10px">
      <div class="fin-row"><span style="color:var(--muted)">${T('Ijara summasi:','Аренда:')}</span><span style="font-weight:600">${fmtNum(r.total)}</span></div>
      <div class="fin-row"><span style="color:var(--muted)">${T('Oldindan to\'lov:','Аванс:')}</span><span style="color:var(--green)">${fmtNum(r.avans||0)}</span></div>
      <div class="fin-row" style="border-color:var(--accent)"><span style="font-weight:600">${T('To\'lanadi:','К оплате:')}</span><span id="qb-tolanadi" style="color:var(--accent);font-weight:700;font-size:15px">${fmtNum(tolanadi)}</span></div>
    </div>
    <div class="pay-row" style="margin-top:10px">
      <button class="pay-btn active" data-pay="naxt" onclick="setPay(this)">💵 ${T('Naxt','Нал')}</button>
      <button class="pay-btn" data-pay="karta" onclick="setPay(this)">💳 ${T('Karta','Карта')}</button>
      <button class="pay-btn" data-pay="otkazma" onclick="setPay(this)">🔄 ${T('O\'tkazma','Перевод')}</button>
      <button class="pay-btn" data-pay="qarz" onclick="setPay(this)">⏳ ${T('Keyin/Qarz','Долг')}</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px">
      <button class="btn-sec" onclick="qbSelRental=null;renderQabul()">${T('Bekor','Отмена')}</button>
      <button class="btn-do" onclick="doQabul()">${T('Qabul qilish','Принять')}</button>
    </div>`;
}
let qbHolat='g';
function setH(btn,t){qbHolat=t;btn.closest('.holat-row').querySelectorAll('.holat-btn').forEach(b=>b.className='holat-btn');btn.classList.add(t==='g'?'active-g':t==='y'?'active-y':'active-r')}
function doQabul(){
  const r=DB.rentals.find(x=>x.id===qbSelRental);if(!r){showToast(T('Ijara tanlanmagan','Не выбрано'),0);return}
  const pay=getPay('#qb-detail');
  const jarima=+document.getElementById('qb-jarima').value||0;
  const izoh=document.getElementById('qb-izoh').value.trim();
  const tolanadi=Math.max(0,r.total-(r.avans||0));
  const dev=findDev(r.devId);if(dev&&dev.rented>0)dev.rented--;
  // holat
  if(qbHolat!=='g'&&dev){if(qbHolat==='r')dev.broken++;}
  // mijoz tarix yangilash
  (r.clientIds||[]).forEach(id=>{const c=findClient(id);if(c){const h=c.history.find(x=>x.status==='ijarada'&&x.date===r.dateOut);if(h)h.status='qaytarilgan';
    if(jarima>0){c.broken.push({device:r.devName,amount:jarima,date:isoToday(),note:izoh||(qbHolat==='r'?T('Jiddiy shikast','Серьёзное')+'':T('Shikast','Повреждение'))});}
    if(pay==='qarz')c.qarzi+=(tolanadi+jarima);else c.qarzi=Math.max(0,c.qarzi);
  }});
  // tranzaksiya
  const amount=tolanadi+jarima;
  DB.txns.push({id:'T'+Date.now(),date:isoToday(),clientName:r.clientNames,kind:jarima>0?'ijara+jarima':'ijara',pay,amount});
  r.status='returned';
  saveDB();
  qbSelRental=null;
  showToast(T('Qabul qilindi!','Принято!'));
  renderQabul();renderIjarada();renderBuzilgan();renderDashboard();
}
</script>


<script>
/* ================= BAND / BRON ================= */
function renderBand(){
  const tb=document.getElementById('band-tbody');if(!tb)return;
  const sm={confirmed:{cls:'b-g',uz:'Tasdiqlangan',ru:'Подтверждён'},pending:{cls:'b-y',uz:'Kutilmoqda',ru:'Ожидание'},cancelled:{cls:'b-r',uz:'Bekor qilingan',ru:'Отменено'}};
  tb.innerHTML=DB.bookings.length?DB.bookings.map(b=>{const s=sm[b.status]||sm.pending;return `<tr>
    <td style="font-size:12px;font-weight:500">${b.clientName}</td>
    <td style="font-size:12px">📷 ${b.devName}</td>
    <td style="font-size:12px">${fmtDate(b.dateOut)}${b.dateIn&&b.dateIn!==b.dateOut?' → '+fmtDate(b.dateIn):''}</td>
    <td style="font-size:11px;color:var(--muted)">${b.timeOut}-${b.timeIn}</td>
    <td><span class="badge ${s.cls}">● ${lang==='uz'?s.uz:s.ru}</span></td>
    <td><div class="act-btns"><button class="ab ab-g" onclick="bronToIjara('${b.id}')" title="${T('Ijaraga','В аренду')}">▶</button><button class="ab ab-r" onclick="cancelBron('${b.id}')">✕</button></div></td>
  </tr>`}).join(''):`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px">${T('Bron yo\'q','Нет броней')}</td></tr>`;
}
let bronClientSel=null,bronDevId=null;
function openBron(){
  bronClientSel=null;
  document.getElementById('bron-client').value='';
  const sel=document.getElementById('bron-dev');
  sel.innerHTML=allDevs().map(d=>`<option value="${d.id}">${d.ico} ${d.name} — ${T('omborda','склад')}: ${getAvail(d)}</option>`).join('');
  sel.onchange=bronStock;
  initCal('bron','bron-cal',{});
  document.getElementById('modal-bron').classList.add('open');
  bronStock();
}
function bronStock(){
  const id=document.getElementById('bron-dev').value;const d=findDev(id);const box=document.getElementById('bron-stock');
  if(d){const av=getAvail(d);box.innerHTML=`<span class="${av>0?'tg-yes':'tg-no'}">${T('Omborda mavjud','Доступно на складе')}: ${av} / ${d.total}</span>`}
}
function openBronClient(){filterBronClient(document.getElementById('bron-client').value)}
function filterBronClient(v){
  const drop=document.getElementById('bron-client-drop');
  const f=DB.clients.filter(c=>!v||clientFullName(c).toLowerCase().includes(v.toLowerCase()));
  if(!f.length){drop.classList.remove('open');return}
  drop.innerHTML=f.map(c=>`<div class="taklif-item" onclick="selBronClient('${c.id}')"><div class="taklif-ava">${c.ism[0]}</div><div><div style="font-size:12.5px;font-weight:500">${clientFullName(c)}${c.blacklist?' 🚫':''}</div><div style="font-size:10px;color:var(--muted)">${c.id}</div></div></div>`).join('');
  drop.classList.add('open');
}
function selBronClient(id){bronClientSel=id;document.getElementById('bron-client').value=clientFullName(findClient(id));document.getElementById('bron-client-drop').classList.remove('open')}
function saveBron(){
  if(!bronClientSel){showToast(T('Mijoz tanlang!','Выберите клиента!'),0);return}
  const d=findDev(document.getElementById('bron-dev').value);if(!d){showToast(T('Texnika tanlang!','Выберите технику!'),0);return}
  const r=calRange('bron');if(!r){showToast(T('Sana tanlang!','Выберите дату!'),0);return}
  if(getAvail(d)<=0){showToast(T('Omborda mavjud emas!','Нет на складе!'),0);return}
  d.bron++;
  DB.bookings.push({id:'B-'+Date.now(),clientName:clientFullName(findClient(bronClientSel)),devName:d.name,devId:d.id,dateOut:r.from,dateIn:r.to,timeOut:document.getElementById('bron-t1').value,timeIn:document.getElementById('bron-t2').value,status:'confirmed'});
  saveDB();closeModal('bron');renderBand();renderTx('');showToast(T('Bron qilindi!','Забронировано!'));
}
function cancelBron(id){const b=DB.bookings.find(x=>x.id===id);if(!b)return;if(b.status==='cancelled')return;b.status='cancelled';const d=findDev(b.devId);if(d&&d.bron>0)d.bron--;saveDB();renderBand();showToast(T('Bron bekor qilindi','Бронь отменена'),0)}
function bronToIjara(id){const b=DB.bookings.find(x=>x.id===id);if(!b)return;const d=findDev(b.devId);if(d&&d.bron>0)d.bron--;b.status='cancelled';saveDB();const c=DB.clients.find(x=>clientFullName(x)===b.clientName);nav('ijara',null);setTimeout(()=>{if(c)ijAddClient(c.id);if(d)ijAddDev(d.id)},60);showToast(T('Ijaraga o\'tkazildi','Перенесено в аренду'))}

/* ================= IJARADA ================= */
function renderIjarada(){
  const tb=document.getElementById('ijarada-tbody');if(!tb)return;
  const act=DB.rentals.filter(r=>r.status==='active');
  tb.innerHTML=act.length?act.map(r=>`<tr>
    <td style="font-weight:500">${r.clientNames}</td><td>${r.devName}</td>
    <td style="font-size:11px">${fmtDate(r.dateOut)} ${r.timeOut}</td>
    <td style="font-size:11px">${fmtDate(r.dateIn)} ${r.timeIn}</td>
    <td style="color:var(--green)">${fmtNum(r.total)}</td>
    <td><div class="act-btns"><button class="ab ab-b" onclick="openExtend('${r.id}')" title="${T('Uzaytirish','Продлить')}">⏱</button><button class="ab ab-g" onclick="qbSelRental='${r.id}';nav('qabul',null)" title="${T('Qabul','Приёмка')}">✓</button></div></td>
  </tr>`).join(''):`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px">${T('Faol ijara yo\'q','Нет активных аренд')}</td></tr>`;
}
let extendRentalId=null;
function openExtend(id){
  const r=DB.rentals.find(x=>x.id===id);if(!r)return;extendRentalId=id;
  document.getElementById('extend-body').innerHTML=`
    <div style="font-size:13px;font-weight:600;margin-bottom:8px">${r.clientNames} — ${r.devName}</div>
    <div class="fin-row"><span style="color:var(--muted)">${T('Hozirgi qaytarish','Текущий возврат')}:</span><span>${fmtDate(r.dateIn)} ${r.timeIn}</span></div>
    <div class="form-field" style="margin-top:10px"><label>${T('Necha kunga uzaytirish?','На сколько дней?')}</label><input class="form-input" id="extend-days" type="number" value="1" min="1" oninput="extendCalc()"></div>
    <div class="sum-box" style="margin-top:10px"><div class="sum-lbl">${T('Qo\'shimcha summa','Доп. сумма')}:</div><div class="sum-val" id="extend-sum">${fmtMoney(r.price)}</div></div>
    <div class="fin-row" style="margin-top:8px;border-color:var(--accent)"><span style="font-weight:600">${T('Yangi qaytarish sanasi','Новая дата')}:</span><span id="extend-newdate" style="color:var(--accent)">${fmtDate(isoOf(new Date(new Date(r.dateIn).getTime()+86400000)))}</span></div>`;
  document.getElementById('modal-extend').classList.add('open');
}
function extendCalc(){
  const r=DB.rentals.find(x=>x.id===extendRentalId);if(!r)return;
  const days=Math.max(1,+document.getElementById('extend-days').value||1);
  document.getElementById('extend-sum').textContent=fmtMoney(r.price*days);
  document.getElementById('extend-newdate').textContent=fmtDate(isoOf(new Date(new Date(r.dateIn).getTime()+days*86400000)));
}
function saveExtend(){
  const r=DB.rentals.find(x=>x.id===extendRentalId);if(!r)return;
  const days=Math.max(1,+document.getElementById('extend-days').value||1);
  r.dateIn=isoOf(new Date(new Date(r.dateIn).getTime()+days*86400000));
  r.days+=days;r.total+=r.price*days;
  saveDB();closeModal('extend');renderIjarada();showToast(T('Muddat uzaytirildi!','Срок продлён!'));
}

/* ================= BUZILGAN ================= */
function renderBuzilgan(){
  const tb=document.getElementById('buzilgan-tbody');if(!tb)return;
  const rows=[];
  DB.clients.forEach(c=>(c.broken||[]).forEach(b=>rows.push({dev:b.device,client:clientFullName(c),holat:b.note||'—',jarima:b.amount,date:b.date})));
  tb.innerHTML=rows.length?rows.map(r=>`<tr><td>${r.dev}</td><td>${r.client}</td><td><span class="badge b-r">${r.holat}</span></td><td style="color:var(--red)">${fmtNum(r.jarima)}</td><td style="font-size:11px;color:var(--muted)">${fmtDate(r.date)}</td></tr>`).join(''):`<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">${T('Buzilgan texnika yo\'q','Нет поломок')}</td></tr>`;
}

/* ================= XODIMLAR ================= */
let editWorkerId=null;
function renderXodimlar(){
  const tb=document.getElementById('xodim-tbody');if(!tb)return;
  tb.innerHTML=DB.workers.map(w=>`<tr>
    <td><div class="ava">${w.name[0]}</div></td>
    <td style="font-weight:500">${w.name}<div style="font-size:10px;color:var(--muted)">${w.phone||''}</div></td>
    <td style="font-family:monospace;font-size:11px;color:var(--accent)">${w.login}</td>
    <td><span class="badge role-gost" style="border:none">${T('Ishchi','Сотрудник')}</span></td>
    <td><div style="display:flex;align-items:center;gap:5px"><span class="badge ${w.active?'b-g':'b-r'}">${w.active?T('Aktiv','Актив'):T('Bloklangan','Заблок.')}</span><button class="toggle ${w.active?'on':''}" onclick="toggleWorker('${w.id}')"></button></div></td>
    <td><div class="act-btns"><button class="ab ab-b" onclick="editWorker('${w.id}')">✏</button><button class="ab ab-r" onclick="delWorker('${w.id}')">🗑</button></div></td>
  </tr>`).join('')||`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px">${T('Ishchi yo\'q','Нет сотрудников')}</td></tr>`;
}
function openNewWorker(){editWorkerId=null;document.getElementById('worker-title').textContent=T('Ishchi qo\'shish','Добавить сотрудника');['w-name','w-login','w-pass','w-phone'].forEach(id=>document.getElementById(id).value='');document.getElementById('modal-worker').classList.add('open')}
function editWorker(id){const w=DB.workers.find(x=>x.id===id);if(!w)return;editWorkerId=id;document.getElementById('worker-title').textContent=T('Ishchini tahrirlash','Редактировать');document.getElementById('w-name').value=w.name;document.getElementById('w-login').value=w.login;document.getElementById('w-pass').value=w.pass;document.getElementById('w-phone').value=w.phone||'';document.getElementById('modal-worker').classList.add('open')}
function saveWorker(){
  const name=document.getElementById('w-name').value.trim(),login=document.getElementById('w-login').value.trim(),pass=document.getElementById('w-pass').value.trim();
  if(!name||!login||!pass){showToast(T('Ism, login va parol majburiy!','Заполните поля!'),0);return}
  if(DB.workers.some(w=>w.login===login&&w.id!==editWorkerId)){showToast(T('Bu login band!','Логин занят!'),0);return}
  if(editWorkerId){const w=DB.workers.find(x=>x.id===editWorkerId);Object.assign(w,{name,login,pass,phone:document.getElementById('w-phone').value});showToast(T('Yangilandi','Обновлено'))}
  else{DB.workers.push({id:'W'+Date.now(),name,login,pass,phone:document.getElementById('w-phone').value,role:'gost',active:true});showToast(T('Ishchi qo\'shildi','Добавлен'))}
  saveDB();closeModal('worker');renderXodimlar();
}
function toggleWorker(id){const w=DB.workers.find(x=>x.id===id);if(w){w.active=!w.active;saveDB();renderXodimlar()}}
function delWorker(id){if(!confirm(T('Ishchini o\'chirasizmi?','Удалить сотрудника?')))return;DB.workers=DB.workers.filter(w=>w.id!==id);saveDB();renderXodimlar();showToast(T('O\'chirildi','Удалён'),0)}

/* ================= CHAT ================= */
let chatWorker=null;
function renderChat(){
  const list=document.getElementById('chat-list');if(!list)return;
  list.innerHTML=DB.workers.map(w=>{const msgs=DB.messages.filter(m=>m.workerId===w.id);const last=msgs[msgs.length-1];
    return `<div class="chat-li ${chatWorker===w.id?'active':''}" onclick="selChat('${w.id}')"><div class="cl-ava">${w.name[0]}</div><div style="min-width:0"><div style="font-size:13px;font-weight:600">${w.name}</div><div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last?last.text:T('Xabar yo\'q','Нет сообщений')}</div></div></div>`}).join('');
  if(!chatWorker&&DB.workers.length)selChat(DB.workers[0].id);else renderChatMsgs();
}
function selChat(id){chatWorker=id;renderChat();renderChatMsgs()}
function renderChatMsgs(){
  const box=document.getElementById('chat-msgs');const head=document.getElementById('chat-head');if(!box)return;
  const w=DB.workers.find(x=>x.id===chatWorker);if(!w){box.innerHTML='';head.textContent=T('Suhbatni tanlang','Выберите чат');return}
  head.textContent='💬 '+w.name;
  const msgs=DB.messages.filter(m=>m.workerId===chatWorker);
  box.innerHTML=msgs.map(m=>`<div class="msg ${m.from==='admin'?'me':'them'}">${m.text}<div class="mt">${m.time}</div></div>`).join('')||`<div style="text-align:center;color:var(--muted);font-size:12px;margin:auto">${T('Xabar yozing','Напишите сообщение')}</div>`;
  box.scrollTop=box.scrollHeight;
}
function sendMsg(){
  const inp=document.getElementById('chat-input');const txt=inp.value.trim();if(!txt||!chatWorker)return;
  const now=new Date();const time=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  DB.messages.push({workerId:chatWorker,from:'admin',text:txt,time});
  inp.value='';saveDB();renderChatMsgs();renderChat();
}
function updateChatBadge(){const b=document.getElementById('chat-badge');if(b)b.classList.add('hidden')}

/* ================= QORA RO'YXAT ================= */
function renderBlacklist(){
  const tb=document.getElementById('blk-tbody');if(!tb)return;
  const blk=DB.clients.filter(c=>c.blacklist);
  tb.innerHTML=blk.length?blk.map(c=>`<tr><td><div class="ava">${c.ism[0]}</div></td><td style="font-weight:500;cursor:pointer" onclick="openDetail('${c.id}')">${clientFullName(c)}</td><td style="color:var(--yellow)">${(c.phones[0]||{}).num||'—'}</td><td style="color:var(--red)">${fmtNum(c.qarzi)}</td><td style="font-size:11px;color:var(--muted)">${c.details||'—'}</td><td><button class="ab ab-g" onclick="toggleBlacklist('${c.id}')" title="${T('Oqlash','Из ЧС')}">↩</button></td></tr>`).join(''):`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px">${T('Qora ro\'yxat bo\'sh','ЧС пуст')}</td></tr>`;
}

/* ================= HISOBOT ================= */
let repPeriod='day';
function setPeriod(p){repPeriod=p;document.querySelectorAll('.period-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('data-per')===p));document.getElementById('period-range').style.display=p==='custom'?'inline-flex':'none';renderReport()}
function inPeriod(date){
  const today=isoToday();
  if(repPeriod==='day')return date===today;
  if(repPeriod==='month')return date.slice(0,7)===today.slice(0,7);
  if(repPeriod==='year')return date.slice(0,4)===today.slice(0,4);
  if(repPeriod==='custom'){const f=document.getElementById('per-from').value,t=document.getElementById('per-to').value;if(!f||!t)return true;return date>=f&&date<=t}
  return true;
}
function renderReport(){
  const txns=DB.txns.filter(t=>inPeriod(t.date));
  const sum=k=>txns.filter(t=>t.pay===k).reduce((s,t)=>s+t.amount,0);
  const naxt=sum('naxt'),karta=sum('karta'),otkazma=sum('otkazma'),qarz=sum('qarz');
  const total=naxt+karta+otkazma;
  const cards=document.getElementById('rep-cards');
  if(cards)cards.innerHTML=`
    <div class="rep-card rc-total"><div class="rc-lbl">💰 ${T('Jami kirim','Всего')}</div><div class="rc-val" style="color:var(--accent)">${fmtNum(total)}</div></div>
    <div class="rep-card rc-cash"><div class="rc-lbl">💵 ${T('Naxt','Наличные')}</div><div class="rc-val" style="color:var(--green)">${fmtNum(naxt)}</div></div>
    <div class="rep-card rc-card"><div class="rc-lbl">💳 ${T('Karta','Карта')}</div><div class="rc-val" style="color:var(--purple)">${fmtNum(karta)}</div></div>
    <div class="rep-card rc-transfer"><div class="rc-lbl">🔄 ${T('O\'tkazma','Перевод')}</div><div class="rc-val" style="color:var(--orange)">${fmtNum(otkazma)}</div></div>
    <div class="rep-card rc-debt"><div class="rc-lbl">⏳ ${T('Qarz','Долг')}</div><div class="rc-val" style="color:var(--red)">${fmtNum(qarz)}</div></div>`;
  const payLbl={naxt:'💵 '+T('Naxt','Нал'),karta:'💳 '+T('Karta','Карта'),otkazma:'🔄 '+T('O\'tkazma','Перевод'),qarz:'⏳ '+T('Qarz','Долг')};
  const tb=document.getElementById('rep-tbody');
  if(tb)tb.innerHTML=txns.length?txns.slice().reverse().map(t=>`<tr><td style="font-size:11px">${fmtDate(t.date)}</td><td>${t.clientName}</td><td><span class="badge b-b" style="font-size:10px">${t.kind}</span></td><td>${payLbl[t.pay]||t.pay}</td><td style="color:${t.pay==='qarz'?'var(--red)':'var(--green)'};font-weight:600">${fmtNum(t.amount)}</td></tr>`).join(''):`<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">${T('Bu davrda tranzaksiya yo\'q','Нет транзакций')}</td></tr>`;
}

/* ================= AKKAUNT / KURS ================= */
function renderAkkaunt(){
  document.getElementById('acc-name').textContent=currentUser.name;
  document.getElementById('acc-ava').textContent=currentUser.name[0];
  const rp=document.getElementById('acc-role');rp.innerHTML=`<span class="role-pill ${currentUser.role==='admin'?'role-admin':'role-gost'}">${currentUser.role==='admin'?'Admin':T('Ishchi','Сотрудник')}</span>`;
  document.getElementById('acc-kurs').textContent='1$ = '+fmtNum(DB.rate)+" so'm";
  document.getElementById('acc-clients').textContent=DB.clients.length;
  document.getElementById('acc-devs').textContent=allDevs().reduce((s,d)=>s+d.total,0);
}
function adminEditKurs(){
  if(currentUser.role!=='admin'){showToast(T('Kursni faqat admin o\'zgartiradi','Только админ'),0);return}
  document.getElementById('kurs-inp').value=DB.rate;document.getElementById('modal-kurs').classList.add('open');
}
function saveKurs(){const v=+document.getElementById('kurs-inp').value;if(!v||v<=0){showToast(T('Noto\'g\'ri qiymat','Неверно'),0);return}DB.rate=v;saveDB();closeModal('kurs');applyLang();renderAkkaunt();showToast(T('Kurs yangilandi','Курс обновлён'))}

/* ================= INIT ================= */
loginTab('admin');
applyLang();
</script>
